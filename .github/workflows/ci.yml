name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes viewer tools tests
      - name: Unit tests
        run: python -m pytest tests/test_logic.py
      - name: Import check (UI and session modules, without libmpv)
        run: python -c "import viewer.source, viewer.profiles, viewer.bridge, viewer.session, viewer.config, viewer.theme"

  package:
    name: Portable package (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build (downloads libmpv and verifies its SHA-256)
        shell: pwsh
        run: |
          python -m venv .venv
          ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: GlintRemote-Windows-x64
          path: |
            dist/GlintRemote-Windows-x64.zip
            dist/GlintRemote-Windows-x64.zip.sha256
          retention-days: 14
